plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'maven-publish'
}

group = 'com.hkjustar.monitorx'
version = providers.gradleProperty('monitorx.version').getOrElse('0.1.0-SNAPSHOT')

android {
    namespace = "com.hkjustar.monitor.okhttp"

    compileSdk 36

    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        //通过脱糖可以使用最多Java 11 api
        //https://developer.android.com/studio/write/java11-minimal-support-table
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {

    api project(':monitorX:source-okhttp')

    implementation(libs.androidx.core.ktx)
    implementation libs.androidx.lifecycle.runtimeKtx
    implementation libs.androidx.lifecycle.livedata.ktx

    implementation libs.okhttp
    implementation libs.gson
    implementation libs.room.runtime
    kapt libs.room.compiler
    implementation libs.room.ktx
    implementation(libs.androidx.startup.runtime)

    implementation "io.github.lygttpod.android-local-service:core:0.0.1"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'monitor-okhttp'
            }
        }
    }
}
